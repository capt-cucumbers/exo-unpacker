# Copy this file to config.toml and fill in all values before running.
# Every field is required — no defaults are assumed.

[settings]
# The release key to use when --release is not specified on the command line.
default_release = "eXoDOS_v6.04"


# ---------------------------------------------------------------------------
# Add one [releases."<key>"] block per eXo collection you want to use.
# The key must match the value set in default_release (or passed via --release).
# ---------------------------------------------------------------------------

[releases."eXoAppleIIGS_v1"]
name = "eXoAppleIIGS v1"
extractor_type = "exoappleiigs"
platform = "Apple IIGS"
source = "eXoAppleIIGS"
# Path to the root of the release source:
source_dir = "C:\\Path\\To\\eXoAppleIIGS\\v1"
game_zips_subdir = "eXoAppleIIGS/eXo/eXoAppleIIGS"
metadata_zip_subdir = "eXoAppleIIGS/Content/XOAppleIIGSMetadata.zip"
dos_metadata_zip_subdir = "eXoAppleIIGS/Content/!AppleIIGSmetadata.zip"
# Subpath within source_dir to the util zip bundle:
util_zip_subdir = "eXoAppleIIGS/eXo/util/utilAppleIIGS.zip"
xml_db_path = "xml/all/Apple IIGS.xml"
# Path to the manifest file (relative to project root or absolute):
manifest_path = "manifests/eXoAppleIIGS.json"
ignores_path = "ignores/eXoAppleIIGS.json"
overrides_path = "overrides/eXoAppleIIGS.json"
# Destination directories — must include the full PC/{platform}/{source} suffix:
games_root_dir = "C:\\eXo\\Games\\PC\\Apple IIGS\\eXoAppleIIGS"
metadata_root_dir = "C:\\eXo\\Metadata\\PC\\Apple IIGS\\eXoAppleIIGS"
media_root_dir = "C:\\eXo\\Media\\PC\\Apple IIGS\\eXoAppleIIGS"
# Directory to extract util tools into (absolute path):
util_root_dir = "C:\\eXo\\Games\\PC\\Apple IIGS\\util"
# Template (relative to project root) for the bat file written into each game folder:
setup_template = "templates/exoappleiigs_setup.bat"

[[releases."eXoAppleIIGS_v1".util_sub_extracts]]
archive_pattern = "EXT*.zip"
include = ["emulators/", "Emulators/", "mt32/"]
dest = "{platform_root}"

[[releases."eXoAppleIIGS_v1".util_sub_extracts]]
archive_pattern = "OPT*.zip"
include = []
dest = "{util_root}"

